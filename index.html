::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,45,107,.35);border-radius:4px}

@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,45,107,.4)}50%{box-shadow:0 0 0 10px rgba(255,45,107,0)}}
.fade-in{animation:fadeIn .35s ease forwards}

function genTrackCode(){
  const adj=["VIBRANT","CHIC","BOLD","FRESH","ICONIC","TRENDY"];
  const n=["MELIS","XO","STYLE","DROP","FIT"];
  return `#XSIDE_${adj[Math.floor(Math.random()*adj.length)]}_${n[Math.floor(Math.random()*n.length)]}_${Math.random().toString(36).slice(2,6).toUpperCase()}`;
}

/* ── API ─────────────────────────────────────────────────────────────── */
async function callClaude(apiKey, system, userContent, history=[]) {
  if (!apiKey) return null;
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system,
        messages:[...history,{role:"user",content:typeof userContent==="string"?userContent:userContent}]})
    });
    const data = await res.json();
    return data.content?.map(c=>c.text||"").join("")||null;
  } catch(e){ return null; }
}

/* ══ CHAT TAB (with photo + outfit visual + fit + care) ══════════════════ */
function ChatTab({apiKey}){
  const [msgs,setMsgs] = useState([
    {role:"bot",text:"Merhaba! 🙈 Ben **Xo**, XSIDE'ın AI stil asistanı! Kıyafet fotoğrafı gönder analiz edeyim, ya da stil danışmanlığı isteyelim ateşleyelim 🔥",},
    {role:"bot",text:"Ne yapmak istersin?",suggestions:["📸 Kıyafet analizi","✨ Bugünkü vibe kombini","📐 Beden/Fit rehberi","🧺 Kumaş bakım rehberi","🛍️ XSIDE'a yönlendir"]}
  ]);
  const [input,setInput] = useState("");
  const [loading,setLoading] = useState(false);
  const [mockIdx,setMockIdx] = useState(0);
  const [previewImg,setPreviewImg] = useState(null);
  const [pendingImg,setPendingImg] = useState(null);
  const [activePanel,setActivePanel] = useState(null); // "fit" | "care"
  const endRef = useRef(null);
  const fileRef = useRef(null);

  const MOCK_CHAT = [
    "Harika fotoğraf! 🔥 Bu parça için **Barrel Jean (Açık Mavi)** ile muhteşem bir kombin çıkar. Şu an TikTok'ta Mob Wife casual combo çok trend — tam bu vibe! #XSIDEStyle ile paylaş, kupon kazan! 🎁",
    "Bu vibe için **Pastel Matching Set + Boxy Crop Tişört** → ikisi de XSIDE'da mevcut! NewJeans aesthetic seviyor musun? 🌸 #XSIDEStyle ile paylaş, kupon kazan! 🎁",
    "Street queen energy! 🙈 **Oversized Grafik Tişört + Kargo Jean** ile statement yaparsın. Fit tavsiyesi: üst oversize, alt fitted — oran mükemmel. #XSIDEStyle ile paylaş, kupon kazan! 🎁",
    "Keten detay analizi: Bu kumaş **soğuk yıkama, doğal kuruma** ister 🌿 Bakımını iyi yaparsan çok uzun ömürlü! Keten + Barrel Jean kombo öneririm. #XSIDEStyle ile paylaş, kupon kazan! 🎁",
  ];

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[msgs,loading]);

  const handleFile = (e) => {
    const file = e.target.files?.[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => { setPreviewImg(ev.target.result); setPendingImg(ev.target.result); };
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  const send = async (text) => {
    const msg = text||input.trim();
    if(!msg && !pendingImg) return;
    setInput("");

    const userMsg = {role:"user",text:msg||(pendingImg?"📸 Kıyafet fotoğrafı":""),img:pendingImg};
    setMsgs(p=>[...p,userMsg]);
    const imgToSend = pendingImg;
    setPendingImg(null); setPreviewImg(null);
    setLoading(true);

    let reply = null;
    if(apiKey){
      const history = msgs.filter(m=>m.text).slice(-6).map(m=>({role:m.role==="bot"?"assistant":"user",content:m.text?.replace(/\*\*/g,"")||""}));
      let content;
      if(imgToSend){
        const b64 = imgToSend.split(",")[1];
        const mime = imgToSend.split(";")[0].split(":")[1];
        content = [
          {type:"image",source:{type:"base64",media_type:mime,data:b64}},
          {type:"text",text:msg||"Bu kıyafeti analiz et: kombin öner, fit bilgisi ver, kumaş bakımı anlat"}
        ];
      } else {
        content = msg;
      }
      reply = await callClaude(apiKey,
        `Sen Xo, XSIDE markasının GenZ diline hakim kadın maskot stil asistanısın. XSIDE = LC Waikiki 15-25 yaş kadın markası.
Ürünler: basic tişört, boxy tişört, crop gömlek, kargo jean, barrel jean, mini elbise, matching set, eşofman vb.
Kıyafet fotoğrafı gelirse: 1) kombin öner 2) fit/kalıp bilgisi ver 3) kumaş bakım talimatı ver 4) TikTok/IG trend referansı ekle

- Sona "#XSIDEStyle ile paylaş, kupon kazan! 🎁" ekle`,
        content, history
      );
    }
    if(!reply){reply=MOCK_CHAT[mockIdx%MOCK_CHAT.length];setMockIdx(p=>p+1);}
    setMsgs(p=>[...p,{role:"bot",text:reply,showShare:reply.includes("#XSIDEStyle")}]);

    {fit:"Barrel / Şalvar",desc:"Kalçadan bol, dizden daralan siluet. Normal bedeninizi alın, fazla büyük seçmeyin.",emoji:"🛢️"},
    {fit:"Bodycon / Slim",desc:"Vücut ölçülerinize uygun beden seçin, normalden büyük almayın. Streç içerdiği için rahat giyer.",emoji:"💫"},
    {fit:"Crop / Kısa Üstler",desc:"Normal bedeni alın. İçe tucking veya high-waist altlarla kullanmak oranı mükemmelleştirir.",emoji:"✂️"},
    {fit:"Matching Set",desc:"Üst ve alt ayrı beden olabilir, ama set aldığınızda büyük olanı baz alın.",emoji:"👘"},
  ];

  const CARE_GUIDE = [
    {fabric:"Pamuklu Örme (Jersey)",care:"30°C hassas program, ters çevir, düşük ısı kurutma",icons:["🌊","💨"]},
    {fabric:"Denim",care:"30°C, ters çevir, sık yıkama yapmaktan kaçın — renk korunur",icons:["🌊","🌥️"]},
    {fabric:"Keten",care:"Soğuk yıkama veya el yıkama, doğal kuruma, buharla ütüle",icons:["🤲","💨","🔥"]},
    {fabric:"Kırışık Örme (Crinkle)",care:"El yıkama, asarak kurut — çamaşır makinesinde şekil bozulabilir",icons:["🤲","💨"]},
    {fabric:"Mesh / Tül",care:"El yıkama, düz zemine sererek kuru — makine YASAK",icons:["🤲","💨"]},
    {fabric:"İnterlok",care:"30°C normal program, uzun kurutma makinesi kullanmaktan kaçın",icons:["🌊","🌥️"]},
  ];

  return (
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 72px)"}}>

          <div style={{fontWeight:900,fontSize:15}}>Xo 🙈</div>
          <div style={{fontSize:11,color:C.muted}}>XSIDE AI Stil Asistanı • Aktif</div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setActivePanel(activePanel==="fit"?null:"fit")} style={{padding:"5px 10px",background:activePanel==="fit"?`${C.teal}33`:C.glass,border:`1px solid ${activePanel==="fit"?C.teal:C.glassBorder}`,borderRadius:20,color:activePanel==="fit"?C.teal:C.muted,fontSize:11,fontWeight:700,cursor:"pointer"}}>📐 Fit</button>

            <div key={f.fit} style={{display:"flex",gap:10,padding:"7px 0",borderBottom:`1px solid ${C.glassBorder}`,alignItems:"flex-start"}}>
              <span style={{fontSize:18,flexShrink:0}}>{f.emoji}</span>
              <div><div style={{fontWeight:800,fontSize:12}}>{f.fit}</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>{f.desc}</div></div>
            </div>
          ))}
        </div>
      )}

      {/* Care Panel */}
      {activePanel==="care" && (
        <div style={{background:C.dark3,borderBottom:`1px solid ${C.glassBorder}`,padding:"12px 14px",maxHeight:220,overflowY:"auto"}}>
          <div style={{fontSize:12,fontWeight:800,letterSpacing:2,color:C.purple,marginBottom:10}}>🧺 KUMAŞ BAKIM REHBERİ</div>
          {CARE_GUIDE.map(c=>(
            <div key={c.fabric} style={{padding:"7px 0",borderBottom:`1px solid ${C.glassBorder}`}}>
              <div style={{fontWeight:800,fontSize:12,marginBottom:3}}>{c.icons.join(" ")} {c.fabric}</div>
              <div style={{fontSize:11,color:C.muted}}>{c.care}</div>
            </div>
          ))}
        </div>
      )}

      {/* Messages */}
      <div style={{flex:1,overflowY:"auto",padding:"12px 12px"}}>
        {msgs.map((m,i)=>(
          <div key={i} className="fade-in">
            <div style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",marginBottom:6,gap:6,alignItems:"flex-end"}}>
              {m.role==="bot" && <Mascot size={28}/>}
              <div style={{maxWidth:"78%"}}>
                {m.img && (
                  <img src={m.img} alt="upload" style={{width:"100%",maxWidth:200,borderRadius:12,marginBottom:4,display:"block",marginLeft:"auto"}}/>
                )}
                <div style={{padding:"10px 14px",fontSize:13,lineHeight:1.6,color:C.white,
                  background:m.role==="user"?`linear-gradient(135deg,${C.pink},#ff6b9d)`:C.glass,
                  borderRadius:m.role==="user"?"18px 18px 4px 18px":"18px 18px 18px 4px",
                  border:m.role==="bot"?`1px solid ${C.glassBorder}`:"none",backdropFilter:"blur(10px)"}}>
                  {m.text?.split("**").map((p,j)=>j%2===1?<b key={j}>{p}</b>:p)}
                </div>
              </div>
            </div>
            {m.suggestions && (
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginLeft:34,marginBottom:8}}>
                {m.suggestions.map(s=>(
                  <button key={s} onClick={()=>send(s)} style={{padding:"6px 12px",background:C.glass,border:`1px solid ${C.glassBorder}`,borderRadius:20,color:C.white,fontSize:11,fontWeight:600,cursor:"pointer"}}>{s}</button>
                ))}
              </div>
            )}
            {m.showShare && (
              <div style={{marginLeft:34,marginBottom:8}}>
                <button onClick={()=>setMsgs(p=>[...p,{role:"bot",text:`🎉 İşte kuponun: **${genCoupon("XO")}** — LC Waikiki'de geçerli! Takip kodun: **${genTrackCode()}** 🎯`}])}
                  style={{padding:"8px 16px",background:`linear-gradient(90deg,${C.pink},#ff6b9d)`,border:"none",borderRadius:20,color:"white",fontSize:12,fontWeight:800,cursor:"pointer"}}>
                  📲 Paylaş & Kupon + Kod Al!
                </button>
              </div>
            )}
          </div>
        ))}
        {loading && (
          <div style={{display:"flex",gap:6,alignItems:"flex-end",marginBottom:6}}>
            <Mascot size={28}/>
            <div style={{background:C.glass,borderRadius:18,padding:"10px 14px",border:`1px solid ${C.glassBorder}`,display:"flex",gap:4}}>
              {[0,1,2].map(i=><div key={i} style={{width:7,height:7,borderRadius:"50%",background:C.pink,animation:`dot 1.2s ease ${i*.2}s infinite`}}/>)}
            </div>
          </div>
        )}
        <div ref={endRef}/>
      </div>

      {/* Image Preview */}
      {previewImg && (
        <div style={{padding:"8px 12px",background:C.dark2,borderTop:`1px solid ${C.glassBorder}`,display:"flex",alignItems:"center",gap:8}}>
          <img src={previewImg} alt="preview" style={{width:48,height:48,borderRadius:8,objectFit:"cover"}}/>
          <div style={{flex:1,fontSize:12,color:C.muted}}>📸 Fotoğraf hazır, gönder!</div>
          <button onClick={()=>{setPreviewImg(null);setPendingImg(null);}} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:16}}>✕</button>
        </div>
      )}

      {/* Input */}
      <div style={{padding:"10px 12px",background:"rgba(7,6,15,.95)",backdropFilter:"blur(20px)",borderTop:`1px solid ${C.glassBorder}`,display:"flex",gap:8,flexShrink:0}}>
        <input type="file" ref={fileRef} accept="image/*,video/*" onChange={handleFile} style={{display:"none"}}/>
        <button onClick={()=>fileRef.current?.click()} style={{width:44,height:44,borderRadius:12,background:C.glass,border:`1px solid ${C.glassBorder}`,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:18}}>📎</button>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}
          placeholder="Xo'ya sor veya 📎 fotoğraf ekle..."
          style={{flex:1,padding:"11px 14px",background:C.glass,border:`1px solid ${C.glassBorder}`,borderRadius:24,color:C.white,fontSize:13,outline:"none",colorScheme:"dark"}}/>
        <button onClick={()=>send()} style={{width:44,height:44,borderRadius:"50%",background:`linear-gradient(135deg,${C.pink},#ff6b9d)`,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 4px 16px ${C.pink}44`,flexShrink:0}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  );
}

/* ══ WARDROBE TAB ════════════════════════════════════════════════════════ */
function WardrobeTab({apiKey}){
  const [clothes,setClothes] = useState([]);
  const [loading,setLoading] = useState(false);
  const [suggestions,setSuggestions] = useState(null);
  const [trackCode,setTrackCode] = useState(null);
  const [coupon,setCoupon] = useState(null);
  const [shared,setShared] = useState(false);
  const fileRef = useRef(null);

  const addClothes = (e) => {
    const files = Array.from(e.target.files||[]);
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = ev => setClothes(p=>[...p,{img:ev.target.result,name:`Kıyafet ${p.length+1}`,id:Date.now()+Math.random()}]);
      reader.readAsDataURL(file);
    });
    e.target.value="";
  };

  const analyze = async () => {
    if(clothes.length===0) return;
    setLoading(true); setSuggestions(null); setShared(false); setTrackCode(null); setCoupon(null);
    let result = null;

    if(apiKey && clothes.length > 0){
      const content = [
        ...clothes.slice(0,4).map(c=>({type:"image",source:{type:"base64",media_type:c.img.split(";")[0].split(":")[1],data:c.img.split(",")[1]}})),
        {type:"text",text:`Bu ${clothes.length} kıyafeti gören birinin dolabı var. Bu dolaba göre:
1) Hangi XSIDE ürünleri eksik/tamamlayıcı olur? (3-5 ürün öner)
2) TikTok/IG'de trend olan hangi kombinleri yapabilir?
3) Önerilen kombinler için hashtag ver.
Sadece JSON döndür: {"wardrobeStyle":"genel tarz analizi","missingPieces":[{"product":"","reason":"","xsideItem":""}],"trendCombos":[{"name":"","items":[""],"trend":"","hashtags":[""]}],"personalCode":""}`}
      ];
      const raw = await callClaude(apiKey,
        `Sen XSIDE markasının AI gardırop danışmanısın. Kullanıcının mevcut kıyafetlerini analiz edip XSIDE ürünleriyle tamamla.`,
        content
      );
      if(raw){try{result=JSON.parse(raw.replace(/```json|```/g,"").trim());}catch{}}
    }

    if(!result){
      result = {
        wardrobeStyle:"Casual-street mix: rahat ama stil sahibi bir dolap 👗",
        missingPieces:[
          {product:"Barrel Jean",reason:"Dolabında bu silüet eksik — her şeyle gider",xsideItem:"Barrel Jean (Açık Mavi)"},
          {product:"Boxy Grafik Tişört",reason:"Statement piece olarak çok işe yarar",xsideItem:"Oversized Grafik Tişört"},
          {product:"Matching Set",reason:"Hızlı hazırlanma çözümü",xsideItem:"Pastel Matching Set"},
        ],
        trendCombos:[
          {name:"Mob Wife Casual",items:["Mevcut kıyafet + Barrel Jean (XSIDE)","Oversized Tişört (XSIDE)"],trend:"TikTok #1 trend bu hafta",hashtags:["#MobWifeCasual","#XSIDEStyle"]},
          {name:"Clean Girl Aesthetic",items:["Matching Set (XSIDE)","Keten Gömlek (XSIDE)"],trend:"IG Reels'ta çok paylaşılıyor",hashtags:["#CleanGirl","#XSIDEStyle"]},
        ],
        personalCode:genTrackCode()
      };
    }
    result.personalCode = result.personalCode || genTrackCode();
    setSuggestions(result);
    setLoading(false);
  };

  return (
    <div style={{padding:"20px 16px 8px"}} className="fade-in">
      <div style={{marginBottom:16}}>
        <div style={{fontSize:10,letterSpacing:3,color:C.muted}}>AI GARDROP ANALİZİ</div>
        <h2 style={{margin:"4px 0 0",fontSize:22,fontWeight:900}}>👗 Dolabım</h2>
        <p style={{color:C.muted,fontSize:13,margin:"4px 0 0"}}>Kıyafetlerini yükle, XSIDE'dan tamamlayıcı öneriler al</p>
      </div>

      {/* Upload Area */}
      <input type="file" ref={fileRef} accept="image/*" multiple onChange={addClothes} style={{display:"none"}}/>
      <div onClick={()=>fileRef.current?.click()} style={{
        border:`2px dashed ${C.glassBorder}`,borderRadius:20,padding:"28px 20px",textAlign:"center",
        cursor:"pointer",marginBottom:14,background:C.glass,transition:"border-color .2s",
        borderColor:clothes.length>0?C.teal:C.glassBorder
      }}>
        <div style={{fontSize:32,marginBottom:8}}>👗</div>
        <div style={{fontWeight:800,fontSize:14,color:clothes.length>0?C.teal:C.white}}>
          {clothes.length>0?`${clothes.length} kıyafet yüklendi ✓`:"Kıyafet Fotoğrafı Ekle"}
        </div>
        <div style={{fontSize:12,color:C.muted,marginTop:4}}>Birden fazla seçebilirsin</div>
      </div>

      {/* Clothes Grid */}
      {clothes.length>0 && (
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
          {clothes.map(c=>(
            <div key={c.id} style={{position:"relative",borderRadius:12,overflow:"hidden",aspectRatio:"1"}}>
              <img src={c.img} alt={c.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
              <button onClick={()=>setClothes(p=>p.filter(x=>x.id!==c.id))}
                style={{position:"absolute",top:4,right:4,width:22,height:22,borderRadius:"50%",background:"rgba(0,0,0,.6)",border:"none",color:"white",cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
            </div>
          ))}
          <div onClick={()=>fileRef.current?.click()} style={{borderRadius:12,background:C.glass,border:`1px dashed ${C.glassBorder}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",aspectRatio:"1",fontSize:24}}>+</div>
        </div>
      )}

      <Btn onClick={analyze} disabled={clothes.length===0||loading}>
        {loading?"🔍 Analiz ediliyor...":"🤖 XSIDE Kombin Öner"}
      </Btn>

      {loading && <div style={{textAlign:"center",padding:32}}><Mascot size={60} animate/><div style={{color:C.muted,fontSize:13,marginTop:8}}>Dolabın analiz ediliyor...</div></div>}

      {suggestions && !loading && (
        <div className="fade-in" style={{marginTop:14}}>
          {/* Wardrobe Analysis */}
          <GlassCard style={{marginBottom:12,background:`${C.teal}11`,border:`1px solid ${C.teal}33`}}>
            <div style={{fontSize:11,color:C.teal,fontWeight:800,marginBottom:4}}>👗 DOLAP ANALİZİN</div>
            <div style={{fontSize:14,fontWeight:700}}>{suggestions.wardrobeStyle}</div>
          </GlassCard>

          {/* Missing Pieces */}
          <div style={{fontSize:12,fontWeight:800,letterSpacing:2,color:C.muted,marginBottom:10}}>XSIDE'DAN EKLEYEBİLECEKLERİN</div>
          {suggestions.missingPieces?.map((p,i)=>(
            <GlassCard key={i} style={{marginBottom:8,display:"flex",gap:12,alignItems:"flex-start"}}>
              <div style={{width:40,height:40,borderRadius:12,background:`${C.lime}22`,border:`1px solid ${C.lime}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>✨</div>
              <div style={{flex:1}}>
                <div style={{fontWeight:800,fontSize:13,color:C.lime}}>{p.xsideItem}</div>
                <div style={{fontSize:12,color:C.muted,marginTop:2}}>{p.reason}</div>
              </div>
            </GlassCard>
          ))}

          {/* Trend Combos */}
          <div style={{fontSize:12,fontWeight:800,letterSpacing:2,color:C.muted,marginTop:14,marginBottom:10}}>TRENDİNG KOMBİNLER</div>
          {suggestions.trendCombos?.map((c,i)=>(
            <GlassCard key={i} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                <div style={{fontWeight:800,fontSize:14}}>{c.name}</div>
                <Pill color={C.pink}>{c.trend}</Pill>
              </div>
              {c.items?.map((item,j)=>(
                <div key={j} style={{fontSize:12,color:C.muted,padding:"4px 0",borderBottom:`1px solid ${C.glassBorder}`,display:"flex",gap:6}}>
                  <span style={{color:C.lime}}>→</span>{item}
                </div>
              ))}
              <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:8}}>
                {c.hashtags?.map(h=><Pill key={h} color={C.pink}>{h}</Pill>)}
              </div>
            </GlassCard>
          ))}

          {/* Personal Code */}
          <div style={{background:`linear-gradient(135deg,${C.dark3},#1a0a3e)`,border:`1px solid ${C.lime}44`,borderRadius:20,padding:"18px 20px",marginTop:14}}>
            <div style={{fontSize:11,color:C.lime,fontWeight:800,marginBottom:8,letterSpacing:2}}>🎯 KİŞİSEL TAKİP KODUN</div>
            <div style={{fontFamily:"monospace",fontSize:15,fontWeight:900,background:"rgba(0,0,0,.3)",borderRadius:10,padding:"10px 14px",cursor:"pointer",marginBottom:8,wordBreak:"break-all"}}
              onClick={()=>navigator.clipboard?.writeText(suggestions.personalCode)}>
              {suggestions.personalCode}
            </div>
            <div style={{fontSize:12,color:C.muted,marginBottom:12}}>
              Bu kodu TikTok/IG paylaşımının caption'ına ekle. Xo seni tanıyacak, paylaşımını takip edecek ve özel ödüller kazanacaksın! 🙈
            </div>

            {!shared ? (
              <Btn onClick={()=>{setShared(true);setCoupon(genCoupon("DOLAP"));}}>
                📲 Paylaş & Gardrop Kuponu Al!
              </Btn>
            ) : (
              <div style={{background:`linear-gradient(135deg,${C.pink},#ff6b9d)`,borderRadius:16,padding:"14px 16px",border:"1px dashed rgba(255,255,255,.4)"}}>
                <div style={{fontSize:10,fontWeight:700,letterSpacing:3,color:"rgba(255,255,255,.7)",marginBottom:4}}>XSIDE KUPON</div>
                <div style={{fontFamily:"monospace",fontSize:20,fontWeight:900,color:C.lime,letterSpacing:3,cursor:"pointer"}} onClick={()=>navigator.clipboard?.writeText(coupon)}>{coupon}</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,.7)",marginTop:6}}>LC Waikiki & xside.com'da geçerli 🎁</div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ══ STORE TAB ════════════════════════════════════════════════════════════ */
function StoreTab(){
  const [filter,setFilter] = useState("all");
  const [sel,setSel] = useState(null);
  const filtered = filter==="hot"?STORE_STOCK.filter(s=>s.hot):STORE_STOCK;
  return (
    <div style={{padding:"20px 16px 8px"}} className="fade-in">
      <div style={{marginBottom:16}}>
        <div style={{fontSize:10,letterSpacing:3,color:C.muted}}>MAĞAZA EKRANI</div>
        <h2 style={{margin:"4px 0 0",fontSize:22,fontWeight:900}}>🏪 Anlık Stok & Kombin</h2>
        <p style={{color:C.muted,fontSize:13,margin:"4px 0 0"}}>Mağaza içi AI rehber • QR kod ile erişim</p>
      </div>
      <div style={{background:`linear-gradient(135deg,${C.dark3},#1a0a3e)`,borderRadius:16,padding:"14px 16px",marginBottom:14,border:`1px solid ${C.purple}44`}}>
        <div style={{fontSize:10,letterSpacing:3,color:C.purple,fontWeight:700}}>MAĞAZA İÇİ EKRAN MODU</div>
        <div style={{fontWeight:800,fontSize:14,marginTop:4}}>Dokunmatik Stil Asistanı</div>
        <div style={{fontSize:12,color:C.muted,marginTop:2}}>Müşteri QR tarar → Xo karşılar → Stok + kombin + bakım bilgisi</div>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        {[{id:"all",label:"Tümü"},{id:"hot",label:"🔥 Trend"}].map(f=>(
          <button key={f.id} onClick={()=>setFilter(f.id)} style={{padding:"7px 16px",background:filter===f.id?C.pink:C.glass,border:`1px solid ${filter===f.id?C.pink:C.glassBorder}`,borderRadius:20,color:C.white,fontSize:12,fontWeight:700,cursor:"pointer"}}>{f.label}</button>
        ))}
      </div>
      {filtered.map(item=>(
        <GlassCard key={item.name} style={{marginBottom:10,cursor:"pointer",border:sel?.name===item.name?`1px solid ${C.pink}`:`1px solid ${C.glassBorder}`}} onClick={()=>setSel(sel?.name===item.name?null:item)}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <div style={{fontWeight:800,fontSize:14}}>{item.name}</div>
              <div style={{fontSize:12,color:C.muted,marginTop:2}}>Beden: {item.sizes.join(" · ")}</div>
              <div style={{fontSize:11,color:C.purple,marginTop:2}}>🧵 {item.fabric}</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
              {item.hot&&<Pill color={C.pink}>🔥 Trend</Pill>}
              <div style={{fontSize:12,color:item.stock<6?"#FF6B6B":C.lime,fontWeight:700}}>Stok: {item.stock}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:8}}>
            {item.colors.map(c=><span key={c} style={{padding:"3px 8px",background:C.glass,border:`1px solid ${C.glassBorder}`,borderRadius:20,fontSize:11,color:C.muted}}>🎨 {c}</span>)}
          </div>
          {sel?.name===item.name && (
            <div style={{marginTop:12,padding:"10px 0 0",borderTop:`1px solid ${C.glassBorder}`}} className="fade-in">
              <div style={{fontSize:12,color:C.lime,fontWeight:700,marginBottom:6}}>✨ Xo Kombin Önerisi</div>
              <div style={{fontSize:12,color:C.muted,marginBottom:8}}>
                Bu parçayı <b style={{color:C.white}}>Barrel Jean</b> veya <b style={{color:C.white}}>Eşofman Altı</b> ile kombin yap. Renk: <b style={{color:C.white}}>{item.colors[0]}</b>
              </div>
              <div style={{background:`${C.purple}11`,border:`1px solid ${C.purple}33`,borderRadius:10,padding:"8px 12px",marginBottom:8}}>
                <div style={{fontSize:11,color:C.purple,fontWeight:800,marginBottom:2}}>🧺 Bakım</div>
                <div style={{fontSize:11,color:C.muted}}>{item.fabric.includes("Denim")?"30°C ters çevir":"30°C hassas program, düşük ısı"}</div>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                <Pill color={C.lime}>#XSIDEStyle</Pill>
                <Pill color={C.pink}>📸 Paylaş & Kupon</Pill>
              </div>
            </div>
          )}
        </GlassCard>
      ))}
    </div>
  );
}
