/* ── API CALL ─────────────────────────────────────────────────────────── */
async function callClaude(apiKey, system, userMsg, history=[]) {
  if (!apiKey) return null;
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system,messages:[...history,{role:"user",content:userMsg}]})
    });
    const data = await res.json();
    return data.content?.map(c=>c.text||"").join("")||null;
  } catch { return null; }
}

/* ══ CHAT ════════════════════════════════════════════════════════════════ */
function ChatTab({ apiKey }) {
  const [msgs,setMsgs] = useState([
    {role:"bot",text:"Merhaba! 🙈 Ben **Xo**, XSIDE'ın AI stil asistanı! TikTok trendlerine göre en ateşli kombinleri seninle keşfediyoruz 🔥"},
    {role:"bot",text:"Bugün nasıl bir vibe istiyorsun?",suggestions:["☀️ Yazlık Casual","🏙️ Street Look","📸 İçerik Çekimi","🎓 Okul Kombini"]}
  ]);
  const [input,setInput] = useState("");
  const [loading,setLoading] = useState(false);
  const [mockIdx,setMockIdx] = useState(0);
  const endRef = useRef(null);

  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:"smooth"}); },[msgs,loading]);

  const send = async (text) => {
    const msg = text||input.trim(); if(!msg) return;
    setInput(""); setMsgs(p=>[...p,{role:"user",text:msg}]); setLoading(true);
    let reply = null;
    if (apiKey) {
      const history = msgs.filter(m=>m.text).map(m=>({role:m.role==="bot"?"assistant":"user",content:m.text.replace(/\*\*/g,"")}));
      reply = await callClaude(apiKey,
        `Sen Xo, XSIDE markasının GenZ diline hakim maskot chatbotusun. XSIDE = LC Waikiki 15-25 yaş kadın markası.
Ürünler: basic tişört, boxy tişört, crop gömlek, kargo jean, barrel jean, mini elbise, matching set, eşofman vb.
- Her yanıtta 1-2 XSIDE ürün kombini öner (somut ürün + renk)
- TikTok/IG trend referansı ekle
- Türkçe, kısa (max 4 cümle), enerjik, emoji kullan
- Sona "#XSIDEStyle ile paylaş, kupon kazan! 🎁" ekle`,
        msg, history
      );
    }
    if (!reply) { reply = MOCK_CHAT[mockIdx % MOCK_CHAT.length]; setMockIdx(p=>p+1); }
    setMsgs(p=>[...p,{role:"bot",text:reply,showShare:reply.includes("#XSIDEStyle")}]);
    setLoading(false);
  };

  return (
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 72px)"}}>
      <div style={{padding:"14px 16px",background:"rgba(7,6,15,.9)",backdropFilter:"blur(20px)",
        borderBottom:`1px solid ${C.glassBorder}`,display:"flex",alignItems:"center",gap:10}}>
        <div style={{position:"relative"}}>
          <Monkey size={40}/>
          <div style={{width:9,height:9,background:"#00E676",border:`2px solid ${C.dark}`,
            borderRadius:"50%",position:"absolute",bottom:2,right:2}}/>
        </div>
        <div>
          <div style={{fontWeight:900,fontSize:15}}>Xo 🙈</div>
          <div style={{fontSize:11,color:C.muted}}>XSIDE AI Stil Asistanı • Aktif</div>
        </div>
        <div style={{marginLeft:"auto",background:`${C.pink}22`,border:`1px solid ${C.pink}55`,
          borderRadius:20,padding:"4px 10px",fontSize:10,fontWeight:700,color:C.pink}}>#XSIDEStyle</div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:"14px 12px"}}>
        {msgs.map((m,i)=>(
          <div key={i} className="fade-in">
            <div style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",
              marginBottom:6,gap:6,alignItems:"flex-end"}}>
              {m.role==="bot" && <Monkey size={28}/>}
              <div style={{maxWidth:"78%",padding:"10px 14px",fontSize:13,lineHeight:1.6,color:C.white,
                background:m.role==="user"?`linear-gradient(135deg,${C.pink},#ff6b9d)`:C.glass,
                borderRadius:m.role==="user"?"18px 18px 4px 18px":"18px 18px 18px 4px",
                border:m.role==="bot"?`1px solid ${C.glassBorder}`:"none",backdropFilter:"blur(10px)"}}>
                {m.text?.split("**").map((p,j)=>j%2===1?<b key={j}>{p}</b>:p)}
              </div>
            </div>
            {m.suggestions && (
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginLeft:34,marginBottom:8}}>
                {m.suggestions.map(s=>(
                  <button key={s} onClick={()=>send(s)} style={{padding:"6px 12px",background:C.glass,
                    border:`1px solid ${C.glassBorder}`,borderRadius:20,color:C.white,
                    fontSize:12,fontWeight:600,cursor:"pointer"}}>{s}</button>
                ))}
              </div>
            )}
            {m.showShare && (
              <div style={{marginLeft:34,marginBottom:8}}>
                <button onClick={()=>setMsgs(p=>[...p,{role:"bot",text:`🎉 Harika! İşte kuponun: **${genCoupon("XO")}** — LC Waikiki'de geçerli! 🎁`}])}
                  style={{padding:"8px 16px",background:`linear-gradient(90deg,${C.pink},#ff6b9d)`,
                    border:"none",borderRadius:20,color:"white",fontSize:12,fontWeight:800,cursor:"pointer"}}>
                  📲 Paylaş & Kupon Al!
                </button>
              </div>
            )}
          </div>
        ))}
        {loading && (
          <div style={{display:"flex",gap:6,alignItems:"flex-end",marginBottom:6}}>
            <Monkey size={28}/>
            <div style={{background:C.glass,borderRadius:18,padding:"10px 14px",
              border:`1px solid ${C.glassBorder}`,display:"flex",gap:4}}>
              {[0,1,2].map(i=><div key={i} style={{width:7,height:7,borderRadius:"50%",
                background:C.pink,animation:`dot 1.2s ease ${i*.2}s infinite`}}/>)}
            </div>
          </div>
        )}
        <div ref={endRef}/>
      </div>

      <div style={{padding:"10px 12px",background:"rgba(7,6,15,.92)",backdropFilter:"blur(20px)",
        borderTop:`1px solid ${C.glassBorder}`,display:"flex",gap:8}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}
          placeholder="Xo'ya sor... 🙈"
          style={{flex:1,padding:"11px 16px",background:C.glass,border:`1px solid ${C.glassBorder}`,
            borderRadius:24,color:C.white,fontSize:13,outline:"none",colorScheme:"dark"}}/>
        <button onClick={()=>send()} style={{width:44,height:44,borderRadius:"50%",
          background:`linear-gradient(135deg,${C.pink},#ff6b9d)`,border:"none",
          cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",
          boxShadow:`0 4px 16px ${C.pink}44`,flexShrink:0}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  );
}
